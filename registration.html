<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/registration.css">
</head>
<body>
    <div class="form-container">
        <h1>Online Student Registration form</h1>
        <p><strong>Note:For office use only</strong></p>
    <form action="" method="post" id="form">
        <label for="Name">Student full name:</label><br>
        <input type="text" name="Name" id="name" placeholder="Enter Students name:" ><br><br>
        <label for="phone">Parents Phone:</label><br>
        <input type="number" name="phone" id="phone" placeholder="255744450000"><br><br>
        <label for="level">Level of education:</label><br>
        <input type="text" name="level" id="level" placeholder="Form two"><br><br>
        <label for="health">Student health problem:</label><br>
        <input type="text" name="health" id="health" placeholder="short-sightedness"><br><br>
        <label for="Teacher">Registered by:</label><br>
        <input type="text" name="Teacher" id="Teacher" placeholder="Sr.William John"><br><br>
        <button type="submit" id="inputBtn">Add Student</button>
    </form>
</div>

<div>
    <button type="submit" id="displayBtn">List of Students</button>
</div>
<!-- table kwa ajili ya kudisplay wanafunzi tunao add-->
<table>
    <thead>
        <th>ID</th>
        <th>Student full name</th>
        <th>Parents Phone</th>
        <th>Level</th>
        <th>Health problem</th>
        <th>Registered by:</th>
        <th>Action</th>
    </thead>
    <tbody id="table">
       <!--Javascript ita populate student objects hapa-->
    </tbody>
</table>
<script>
    //javascript codes


// declaration of students variable to store student objects as array
    let students = [];


    //constant declaration to take input html elements not values
    const form = document.getElementById("form");
    const nameInput = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const levelInput = document.getElementById("level");
    const healthInput = document.getElementById("health");
    const TeacherInput = document.getElementById("Teacher");
    const displayBtn = document.getElementById("displayBtn");
    const table = document.getElementById("table");

    // constants za kuchukua values kutokka kwenye input types


    // create operation - adding students in array
    form.addEventListener("submit", function(w){
        //prevents browser reloading 
        w.preventDefault();

    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const level = levelInput.value.trim();
    const health = healthInput.value.trim();
    const Teacher = TeacherInput.value.trim();

         // user input validation
    if( name === "" || phone=== "" || level === "" || health === "" || Teacher === ""){
        alert("Please fill all fields");
        return;
    }

    //student object
    const student = {
        id: Date.now(),
        name: name,
        phone: phone,
        level: level,
        health: health,
        Teacher: Teacher,
    };

    // function ya kuadd students kwenye array ya students
    students.push(student);

    //kureset form ili mwanafunzi mwingine aweze kuaddiwa
   form.reset();

    });

    // READ OPERATION - VIEW STUDENTS

    function viewStudents(){
        table.innerHTML = "";

     students.forEach(function(student){

        const row = `
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.phone}</td>
            <td>${student.level}</td>
            <td>${student.health}</td>
            <td>${student.Teacher}</td>
            <!-- action ya aidha delete au update-->
                <td>
                    <button class="edit" onclick = editStudent(${student.id})>Edit📝</button>
                    <button class="delete" onclick = deleteStudent(${student.id})>Delete🗑️</button>
                </td>
        `;


        // += ongeza mwanafunzi mpya lakini pia onesha na wale wa zamani waliopo kwenye array
        table.innerHTML += row ;

     });
    }


    // displaying student's info after clicking a List of students button
    displayBtn.addEventListener("click", function(){
        viewStudents();
    });

    // delete student by id

    function deleteStudent(id){
        const confirmed = confirm("Are you sure you want to delete this student ??");

        if(!confirmed){
            return;
        }

        students = students.filter(function(student){
            return student.id !== id;
        });

        viewStudents();
    }

    //edit operation
    function editStudent(id){

        const student = students.find(function(student){
            return student.id == id;
        });

        //taking new values from user
        const newName = prompt("Enter new name", student.name);
        const newPhone = prompt("Enter new phone", student.phone);
        const newlevel = prompt("Enter new level", student.level);
        const newhealth = prompt("Enter new level", student.health);
        const newTeacher = prompt("Enter new level", student.Teacher);


        if(newName === null || newPhone === null || newlevel === null || newhealth === null || newTeacher === null){
            return;
        }

        //assigning new values to the old fields

        student.name = newName;
        student.phone = newPhone;
        student.level = newlevel;
        student.health = newhealth;
        student.Teacher = newTeacher;   
        viewStudents();
    }

</script>
</body>
</html>
